<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><title>Tatuador - TatuApp</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<header>
  <h1>🖋️ TatuApp - Tatuador</h1>
  <div class="user" id="user-display"></div>
  <div style="display:flex;gap:8px;">
    <a href="/views/profile.html" class="btn secondary" style="width:auto">Mi Perfil</a>
    <a href="/views/calendar.html" class="btn secondary" style="width:auto">Calendario</a>
    <a href="/views/availability.html" class="btn secondary" style="width:auto">Disponibilidad</a>
    <button class="btn outline" onclick="logout()">Cerrar sesión</button>
  </div>
</header>
<main>
  <aside>
    <h3>Mi disponibilidad</h3>
    <label>Día (0=Dom … 6=Sáb)</label><input id="sched-day" type="number" min="0" max="6" value="1">
    <label>Hora inicio</label><input id="sched-start" type="time" value="10:00">
    <label>Hora fin</label><input id="sched-end" type="time" value="18:00">
    <button class="btn" onclick="addSchedule()">Agregar horario</button>
  </aside>
  <div id="app-view">
    <div class="card">
      <h3>Mis horarios semanales</h3>
      <table><thead><tr><th>Día</th><th>Inicio</th><th>Fin</th><th></th></tr></thead><tbody id="artist-schedule"></tbody></table>
    </div>
    <div class="card">
      <h3>Mis citas</h3>
      <table><thead><tr><th>Fecha</th><th>Hora</th><th>Cliente</th><th>Estado</th><th>Precio</th><th>Acciones</th></tr></thead><tbody id="artist-appts"></tbody></table>
    </div>
  </div>
</main>
<script src="/js/app.js"></script>
</body>
</html>
