<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><title>Calendario - TatuApp</title>
<link rel="stylesheet" href="/css/style.css">
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
</head>
<body>
<header>
  <h1>🖋️ TatuApp - Calendario</h1>
  <div class="user" id="user-display"></div>
  <div style="display:flex;gap:8px;">
    <a href="/views/profile.html" class="btn secondary" style="width:auto">Mi Perfil</a>
    <a href="/views/availability.html" class="btn secondary" style="width:auto">Disponibilidad</a>
    <button class="btn outline" onclick="logout()">Cerrar sesión</button>
  </div>
</header>
<main style="padding:20px;">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <h2>Citas agendadas</h2>
    <button class="btn" onclick="refetchCalendar()">Actualizar</button>
  </div>
  <div id="calendar"></div>
</main>
<script src="/js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const u = await (await fetch('/api/me')).json();
  if (!u) { location.href = '/views/login.html'; return; }
  document.getElementById('user-display').textContent = u.username + ' (' + u.role + ')';
  initCalendar();
});
</script>
</body>
</html>
